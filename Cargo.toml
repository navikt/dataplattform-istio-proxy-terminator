[package]
name = "istio-proxy-terminator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.31"
hyper = { version = "1.11.1", default-features = false }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["client", "runtime"] }
reqwest = { version = "0.13.4", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6.5"
